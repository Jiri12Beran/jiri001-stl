<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>STL Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #ffffff;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }

        #fileInput {
            background: #333;
            color: white;
            border: 2px dashed #666;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        #fileInput:hover {
            border-color: #888;
            background: #444;
        }

        #status {
            font-size: 14px;
            padding: 8px;
            border-radius: 4px;
            min-height: 20px;
        }

        #status.ready {
            background-color: #2d5a2d;
            color: #90ee90;
        }

        #status.loading {
            background-color: #5a5a2d;
            color: #ffff90;
        }

        #status.error {
            background-color: #5a2d2d;
            color: #ff9090;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none; /* Zakáže výchozí touch gesta pro vlastní ovládání */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #4a4a4a;
            color: white;
            border: 1px solid #666;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background: #5a5a5a;
        }

        .btn:active {
            background: #3a3a3a;
        }

        .btn.active {
            background: #0066cc;
            border-color: #0066cc;
        }

        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-input-wrapper label {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
        }

        #colorPicker {
            width: 40px;
            height: 30px;
            border: 1px solid #666;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        #colorPicker::-webkit-color-swatch {
            border: none;
            border-radius: 2px;
        }

        .brightness-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
        }

        .brightness-input-wrapper label {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
        }

        #brightnessSlider {
            width: 60px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        #brightnessSlider::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            background: #0066cc;
            border-radius: 50%;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        #brightnessSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #0066cc;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .brightness-value {
            font-size: 11px;
            color: #999;
            min-width: 25px;
            text-align: right;
        }

        /* Mobilní responzivní design */
        @media (max-width: 768px) {
            #ui {
                padding: 10px;
                font-size: 14px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: column;
                gap: 8px;
                margin-top: 10px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 14px;
                min-height: 44px; /* Doporučená velikost pro dotyková zařízení */
            }

            .brightness-input-wrapper,
            .color-input-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 5px;
            }

            .brightness-input-wrapper label,
            .color-input-wrapper label {
                font-size: 12px;
            }

            #lightingSlider {
                width: 100%;
                height: 35px; /* Větší pro snadnější ovládání na dotyku */
            }

            #colorPicker {
                width: 60px;
                height: 40px;
                align-self: center;
            }

            #status {
                font-size: 12px;
                padding: 8px;
                line-height: 1.3;
            }

            /* Skrytí některých prvků na velmi malých displejích */
            @media (max-width: 480px) {
                h1 {
                    font-size: 16px;
                }
                
                .btn {
                    font-size: 13px;
                    padding: 10px 12px;
                }
                
                #lightingSlider {
                    height: 40px;
                }
            }
        }

        /* Orientace na výšku - lepší využití prostoru */
        @media (orientation: portrait) and (max-width: 768px) {
            #ui {
                max-height: 40vh;
                overflow-y: auto;
            }
        }

        /* Přizpůsobení pro dotyková zařízení */
        @media (hover: none) and (pointer: coarse) {
            .btn:hover {
                background: #444; /* Zachovat hover efekt i na dotyku */
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 24px;
                height: 24px; /* Větší thumb pro snazší ovládání */
            }
            
            input[type="range"]::-moz-range-thumb {
                width: 24px;
                height: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>STL Viewer</h1>
        <div class="file-input-wrapper">
            <input 
                type="file" 
                id="fileInput" 
                accept=".stl" 
                aria-label="Vyberte STL soubor pro zobrazení"
            >
        </div>
        <div id="status" role="status" class="loading">Načítání...</div>
        <div class="controls">
            <button id="wireframeToggle" class="btn" aria-label="Přepnout drátový model">
                📐 Drátový model
            </button>
            <div class="brightness-input-wrapper">
                <label for="lightingSlider">💡 Osvětlení:</label>
                <input 
                    type="range" 
                    id="lightingSlider" 
                    min="0.0" 
                    max="3.0" 
                    step="0.1" 
                    value="1.0"
                    aria-label="Nastavte intenzitu osvětlení"
                >
                <span id="lightingValue" class="brightness-value">100%</span>
            </div>
            <div class="color-input-wrapper">
                <label for="colorPicker">🎨 Barva:</label>
                <input 
                    type="color" 
                    id="colorPicker" 
                    value="#00ff88"
                    aria-label="Vyberte barvu modelu"
                >
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js knihovny -->
    <script src="three/three.min.js"></script>
    <script src="three/SimpleSTLLoader.js"></script>
    <script src="main.js"></script>
</body>
</html>
