<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="STL Viewer">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Mobilní STL viewer pro prohlížení 3D modelů">
    
    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon pro různé zařízení -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🔺</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='60' fill='white'>🔺</text></svg>">
    
    <title>STL Viewer - Mobilní 3D prohlížeč</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        h1 {
            margin-bottom: 15px;
            font-size: 24px;
            color: #ffffff;
        }

        .file-input-wrapper {
            margin-bottom: 15px;
        }

        #fileInput {
            background: #333;
            color: white;
            border: 2px dashed #666;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        #fileInput:hover {
            border-color: #888;
            background: #444;
        }

        #status {
            font-size: 14px;
            padding: 8px;
            border-radius: 4px;
            min-height: 20px;
        }

        #status.ready {
            background-color: #2d5a2d;
            color: #90ee90;
        }

        #status.loading {
            background-color: #5a5a2d;
            color: #ffff90;
        }

        #status.error {
            background-color: #5a2d2d;
            color: #ff9090;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none; /* Zakáže výchozí touch gesta pro vlastní ovládání */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
            line-height: 1.4;
        }

        .mobile-instructions {
            display: none;
            margin-top: 10px;
            padding: 8px;
            background: rgba(0, 102, 204, 0.1);
            border: 1px solid rgba(0, 102, 204, 0.3);
            border-radius: 4px;
            font-size: 11px;
            color: #87ceeb;
            line-height: 1.3;
        }

        .touch-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: none;
            z-index: 200;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s ease;
            opacity: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .mobile-only {
            display: none;
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-instructions {
                display: block;
            }
            
            .touch-indicator {
                display: block;
            }
            
            .mobile-only {
                display: inline-block;
            }
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: #4a4a4a;
            color: white;
            border: 1px solid #666;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background: #5a5a5a;
        }

        .btn:active {
            background: #3a3a3a;
        }

        .btn.active {
            background: #0066cc;
            border-color: #0066cc;
        }

        .color-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-input-wrapper label {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
        }

        #colorPicker {
            width: 40px;
            height: 30px;
            border: 1px solid #666;
            border-radius: 4px;
            background: none;
            cursor: pointer;
            padding: 0;
        }

        #colorPicker::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        #colorPicker::-webkit-color-swatch {
            border: none;
            border-radius: 2px;
        }

        .brightness-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 120px;
        }

        .brightness-input-wrapper label {
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
        }

        #brightnessSlider {
            width: 60px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        #brightnessSlider::-webkit-slider-thumb {
            width: 16px;
            height: 16px;
            background: #0066cc;
            border-radius: 50%;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        #brightnessSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #0066cc;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .brightness-value {
            font-size: 11px;
            color: #999;
            min-width: 25px;
            text-align: right;
        }

        /* Mobilní responzivní design */
        @media (max-width: 768px) {
            #ui {
                padding: 10px;
                font-size: 14px;
                width: calc(100vw - 40px);
                max-width: 350px;
                left: 20px;
                right: 20px;
                backdrop-filter: blur(15px);
            }

            h1 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .controls {
                flex-direction: column;
                gap: 12px;
                margin-top: 15px;
            }

            .btn {
                padding: 14px 20px;
                font-size: 16px;
                min-height: 48px; /* Větší pro lepší dotykové ovládání */
                border-radius: 8px;
                font-weight: 500;
            }

            .brightness-input-wrapper,
            .color-input-wrapper {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
                background: rgba(255, 255, 255, 0.05);
                padding: 12px;
                border-radius: 6px;
            }

            .brightness-input-wrapper label,
            .color-input-wrapper label {
                font-size: 14px;
                font-weight: 500;
            }

            #brightnessSlider {
                width: 100%;
                height: 40px; /* Větší pro snadnější ovládání na dotyku */
            }

            #colorPicker {
                width: 80px;
                height: 48px;
                align-self: center;
                border-radius: 8px;
            }

            #status {
                font-size: 13px;
                padding: 12px;
                line-height: 1.4;
                border-radius: 6px;
            }

            #fileInput {
                padding: 16px;
                font-size: 14px;
                border-radius: 8px;
            }

            /* Skrytí některých prvků na velmi malých displejích */
            @media (max-width: 480px) {
                #ui {
                    padding: 8px;
                    width: calc(100vw - 16px);
                    left: 8px;
                    right: 8px;
                }
                
                h1 {
                    font-size: 16px;
                }
                
                .btn {
                    font-size: 15px;
                    padding: 12px 16px;
                    min-height: 44px;
                }
                
                #brightnessSlider {
                    height: 44px;
                }
                
                .brightness-input-wrapper,
                .color-input-wrapper {
                    padding: 10px;
                }
            }
        }

        /* Orientace na výšku - lepší využití prostoru */
        @media (orientation: portrait) and (max-width: 768px) {
            #ui {
                max-height: 45vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch; /* Plynulé scrollování na iOS */
            }
        }

        /* Orientace na šířku na mobilech */
        @media (orientation: landscape) and (max-width: 896px) and (max-height: 414px) {
            #ui {
                max-height: 60vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                font-size: 12px;
            }
            
            h1 {
                font-size: 14px;
                margin-bottom: 8px;
            }
            
            .btn {
                padding: 10px 14px;
                font-size: 13px;
                min-height: 36px;
            }
            
            .controls {
                gap: 8px;
                margin-top: 10px;
            }
        }

        /* Přizpůsobení pro dotyková zařízení */
        @media (hover: none) and (pointer: coarse) {
            .btn:hover {
                background: #555; /* Zachovat hover efekt i na dotyku */
            }
            
            .btn:active {
                background: #666;
                transform: scale(0.98);
                transition: all 0.1s ease;
            }
            
            input[type="range"]::-webkit-slider-thumb {
                width: 28px;
                height: 28px; /* Větší thumb pro snazší ovládání */
                border: 2px solid #fff;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            }
            
            input[type="range"]::-moz-range-thumb {
                width: 28px;
                height: 28px;
                border: 2px solid #fff;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            }

            #fileInput:active {
                background: #555;
                transform: scale(0.98);
            }
        }

        /* Speciální styly pro PWA */
        @media (display-mode: standalone) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            #ui {
                top: calc(20px + env(safe-area-inset-top));
            }
        }

        /* Dark mode podpora */
        @media (prefers-color-scheme: dark) {
            #ui {
                background: rgba(0, 0, 0, 0.9);
                backdrop-filter: blur(20px);
            }
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>STL Viewer v002</h1>
        <div class="file-input-wrapper">
            <input 
                type="file" 
                id="fileInput" 
                accept=".stl" 
                aria-label="Vyberte STL soubor pro zobrazení"
            >
        </div>
        <div id="status" role="status" class="loading">Načítání...</div>
        <div class="controls">
            <button id="wireframeToggle" class="btn" aria-label="Přepnout drátový model">
                📐 Drátový model
            </button>
            <button id="panModeToggle" class="btn mobile-only" aria-label="Přepnout režim posunu">
                👐 Režim posunu
            </button>
            <div class="brightness-input-wrapper">
                <label for="lightingSlider">💡 Osvětlení:</label>
                <input 
                    type="range" 
                    id="lightingSlider" 
                    min="0.0" 
                    max="3.0" 
                    step="0.1" 
                    value="1.0"
                    aria-label="Nastavte intenzitu osvětlení"
                >
                <span id="lightingValue" class="brightness-value">100%</span>
            </div>
            <div class="color-input-wrapper">
                <label for="colorPicker">🎨 Barva:</label>
                <input 
                    type="color" 
                    id="colorPicker" 
                    value="#00ff88"
                    aria-label="Vyberte barvu modelu"
                >
            </div>
        </div>
        
        <div class="mobile-instructions">
            📱 <strong>Mobilní ovládání:</strong><br>
            • <strong>1 prst:</strong> otáčení modelu<br>
            • <strong>Dlouhý stisk (0.6s) + tažení:</strong> posun scény<br>
            • <strong>Tlačítko "Režim posunu":</strong> přepínání režimů<br>
            • <strong>2 prsty:</strong> zoom (štípnutí)
        </div>
    </div>

    <div id="canvas-container"></div>
    
    <div id="touchIndicator" class="touch-indicator">
        👆 Dotyk aktivní
    </div>

    <!-- Three.js knihovny -->
    <script src="three/three.min.js"></script>
    <script src="three/SimpleSTLLoader.js"></script>
    <script src="main.js"></script>
</body>
</html>
